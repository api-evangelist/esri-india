name: Esri India

description: 'Esri India is the Indian subsidiary of Esri, the global leader in geographic information system (GIS) software and spatial analytics. It delivers ArcGIS platforms, mapping solutions, and location intelligence services to enterprises, governments, and developers across India. The company focuses on enabling spatial data-driven decision making, offering training, support, and localized solutions for sectors such as urban planning, transportation, utilities, and agriculture.'

